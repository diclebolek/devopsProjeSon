name: hairsalon_flutter
description: Sirius Beauty & Spa randevu uygulaması
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  dots_indicator: ^3.0.0
  logger: ^2.5.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  # Geçici yerel depolama (asıl backend Supabase). Web'de prefs fallback kullanılır.
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
