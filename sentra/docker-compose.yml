services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
      POSTGRES_DB: sentra
    ports:
      - "5433:5432"
    volumes:
      - sentra-timescale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    build:
      context: ./pipeline
      args:
        CMD: ingest
    environment:
      SENTRA_HTTP_ADDR: ":8080"
      SENTRA_STORE: postgres
      SENTRA_DATABASE_URL: postgres://sentra:sentra@timescaledb:5432/sentra?sslmode=disable
      SENTRA_MQTT_BROKER: tcp://mosquitto:1883
      SENTRA_MQTT_CLIENT_ID: sentra-ingest
      SENTRA_LOG_FORMAT: json
    ports:
      - "8088:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  simulator:
    build:
      context: ./pipeline
      args:
        CMD: simulator
    environment:
      SENTRA_TRANSPORT: mqtt
      SENTRA_MQTT_BROKER: tcp://mosquitto:1883
      SENTRA_DEVICE_ID: motor-lab-01
      SENTRA_REGIME: cycle
      SENTRA_REGIME_PERIOD: "8"
      SENTRA_INTERVAL_MS: "1000"
    depends_on:
      ingest:
        condition: service_healthy

volumes:
  sentra-timescale:
